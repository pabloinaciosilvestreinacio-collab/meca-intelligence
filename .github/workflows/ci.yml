name: Validar Meca Intelligence
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/core.test.js tests/v2.test.js
      - run: node --check src/core.js && node --check src/lab.js && node --check src/v2-core.js && node --check src/v2-ui.js && node --check src/v2-worker.js
  mih-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m compileall -q mih
